teleport:
  nodename: teleport-master
  data_dir: /var/lib/teleport

auth_service:
  enabled: "yes"
  listen_addr: 0.0.0.0:3025
  proxy_listener_mode: multiplex
  tokens:
    - "node:secret-lab-token"

proxy_service:
  enabled: "yes"
  web_listen_addr: 0.0.0.0:3080
  ssh_public_addr: localhost:3023

ssh_service:
  enabled: "yes"
